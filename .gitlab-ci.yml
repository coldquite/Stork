default:
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.32.1 --activate
    - pnpm config set store-dir .cache/pnpm-store

stages:
  - setup
  - code_quality
  - tests
  - build
  - deploy

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .cache/pnpm-store
  policy: pull-push

install_dependencies:
  stage: setup
  script:
    - pnpm install --frozen-lockfile
    - pnpm db:generate
    - pnpm exec nuxt prepare
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules
      - .cache/pnpm-store
      - .nuxt
      - prisma/generated

lint:
  stage: code_quality
  needs:
    - job: install_dependencies
      artifacts: true
  script:
    - pnpm lint

format_check:
  stage: code_quality
  needs:
    - job: install_dependencies
      artifacts: true
  script:
    - pnpm format:check

typecheck:
  stage: code_quality
  needs:
    - job: install_dependencies
      artifacts: true
  script:
    - pnpm typecheck

prisma_schema_and_migrations_eqivalance_check:
  stage: code_quality
  needs:
    - job: install_dependencies
      artifacts: true
  services:
    - name: postgres:18.3-alpine3.23
      alias: db
  variables:
    POSTGRES_DB: stork_app
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql://postgres:postgres@db:5432/stork_app?schema=public
    SHADOW_DATABASE_URL: postgresql://postgres:postgres@db:5432/stork_shadow?schema=public
  script:
    - apt-get update && apt-get install -y postgresql-client
    - PGPASSWORD="$POSTGRES_PASSWORD" psql -h db -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE stork_shadow;"
    - pnpm db:migrations:check

test:
  stage: tests
  needs:
    - job: install_dependencies
      artifacts: true
  script:
    - pnpm test:unit

integration:
  stage: tests
  needs:
    - job: install_dependencies
      artifacts: true
  services:
    - name: postgres:18.3-alpine3.23
      alias: db
  variables:
    POSTGRES_DB: stork_app
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql://postgres:postgres@db:5432/stork_app?schema=public
    NUXT_AUTH_SESSION_SECRET: ci-test-secret
  script:
    - pnpm db:migrate:deploy
    - pnpm dev --host 0.0.0.0 --port 3000 > /tmp/nuxt-dev.log 2>&1 &
    - |
      for i in $(seq 1 60); do
        if node -e "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
          break
        fi
        if [ "$i" -eq 60 ]; then
          cat /tmp/nuxt-dev.log
          exit 1
        fi
        sleep 2
      done
    - pnpm test:integration

licenses_check:
  stage: build
  needs:
    - job: install_dependencies
      artifacts: true
  variables:
    NODE_OPTIONS: '--max-old-space-size=4096'
    SENTRY_DISABLE_SOURCEMAPS_UPLOAD: '1'
  script:
    - pnpm build:with_licenses_check

build_app_image:
  stage: build
  image: docker:28.2.2
  services:
    - name: docker:28.2.2-dind
      alias: docker
  cache: []
  before_script: []
  needs:
    - job: licenses_check
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login "${CI_REGISTRY}" --username "${CI_REGISTRY_USER}" --password-stdin
    - docker build --pull -t "${CI_REGISTRY_IMAGE}/app:${CI_COMMIT_SHA}" -t "${CI_REGISTRY_IMAGE}/app:main" .
    - docker push "${CI_REGISTRY_IMAGE}/app:${CI_COMMIT_SHA}"
    - docker push "${CI_REGISTRY_IMAGE}/app:main"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

deploy_production:
  stage: deploy
  image: alpine:3.23
  cache: []
  variables:
    DEPLOY_SSH_HOST: cap.ksi.in.fit.cvut.cz
    DEPLOY_APP_IMAGE: ${CI_REGISTRY_IMAGE}/app:${CI_COMMIT_SHA}
  before_script:
    - apk add --no-cache bash openssh-client rsync
  script:
    - bash deploy/gitlab-vps-deploy.sh
  resource_group: production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
